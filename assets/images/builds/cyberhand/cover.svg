<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="CyberHand robotic arm">
  <rect width="800" height="600" fill="#0d0d0d"/>
  <!-- ground line -->
  <line x1="220" y1="545" x2="580" y2="545" stroke="#1f1f1f" stroke-width="2"/>
  <!-- base / electronics box -->
  <rect x="300" y="500" width="200" height="60" rx="8" fill="#141414" stroke="#c9b99a" stroke-width="2.5"/>
  <g stroke="#6a6252" stroke-width="2">
    <line x1="330" y1="545" x2="330" y2="520"/>
    <line x1="345" y1="545" x2="345" y2="520"/>
    <line x1="360" y1="545" x2="360" y2="520"/>
    <line x1="375" y1="545" x2="375" y2="520"/>
  </g>
  <!-- turntable -->
  <ellipse cx="400" cy="500" rx="48" ry="12" fill="#141414" stroke="#c9b99a" stroke-width="2.5"/>
  <!-- arm segments -->
  <g stroke="#c9b99a" stroke-width="22" stroke-linecap="round" fill="none">
    <line x1="400" y1="492" x2="400" y2="310"/>
    <line x1="400" y1="310" x2="605" y2="212"/>
  </g>
  <!-- joints -->
  <g fill="#141414" stroke="#c9b99a" stroke-width="3.5">
    <circle cx="400" cy="492" r="20"/>
    <circle cx="400" cy="310" r="20"/>
    <circle cx="605" cy="212" r="17"/>
  </g>
  <circle cx="400" cy="310" r="6" fill="#c9b99a"/>
  <circle cx="400" cy="492" r="6" fill="#c9b99a"/>
  <!-- hand / gripper -->
  <g stroke="#c9b99a" stroke-width="10" stroke-linecap="round" fill="none">
    <line x1="605" y1="212" x2="662" y2="185"/>
    <line x1="662" y1="185" x2="705" y2="158"/>
    <line x1="662" y1="185" x2="708" y2="196"/>
    <line x1="662" y1="185" x2="690" y2="222"/>
  </g>
  <text x="70" y="560" font-family="'Inter',sans-serif" font-size="22" letter-spacing="3"
    fill="#ede9e3" fill-opacity="0.9">5-DOF · 3D-PRINTED · AI-DESIGNED</text>
</svg>
