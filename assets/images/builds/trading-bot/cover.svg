<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Autonomous trading bot">
  <rect width="800" height="600" fill="#0d0d0d"/>
  <g stroke="#1b1b1b" stroke-width="1">
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="440" x2="800" y2="440"/>
  </g>
  <polyline points="70,470 180,440 290,415 400,420 510,355 600,315 690,235 740,185"
    fill="none" stroke="#c9b99a" stroke-width="2.5" stroke-opacity="0.45"
    stroke-linecap="round" stroke-linejoin="round"/>
  <!-- candlesticks (filled = up, outline = down) -->
  <g>
    <!-- down -->
    <line x1="110" y1="430" x2="110" y2="505" stroke="#6a6252" stroke-width="2"/>
    <rect x="99" y="450" width="22" height="45" fill="none" stroke="#6a6252" stroke-width="2"/>
    <!-- up -->
    <line x1="210" y1="405" x2="210" y2="480" stroke="#c9b99a" stroke-width="2"/>
    <rect x="199" y="420" width="22" height="48" fill="#c9b99a"/>
    <!-- up -->
    <line x1="310" y1="385" x2="310" y2="455" stroke="#c9b99a" stroke-width="2"/>
    <rect x="299" y="400" width="22" height="44" fill="#c9b99a"/>
    <!-- down -->
    <line x1="410" y1="395" x2="410" y2="460" stroke="#6a6252" stroke-width="2"/>
    <rect x="399" y="410" width="22" height="38" fill="none" stroke="#6a6252" stroke-width="2"/>
    <!-- up -->
    <line x1="510" y1="330" x2="510" y2="415" stroke="#c9b99a" stroke-width="2"/>
    <rect x="499" y="348" width="22" height="52" fill="#c9b99a"/>
    <!-- up -->
    <line x1="610" y1="295" x2="610" y2="370" stroke="#c9b99a" stroke-width="2"/>
    <rect x="599" y="312" width="22" height="46" fill="#c9b99a"/>
    <!-- up -->
    <line x1="710" y1="215" x2="710" y2="300" stroke="#c9b99a" stroke-width="2"/>
    <rect x="699" y="232" width="22" height="52" fill="#c9b99a"/>
  </g>
  <!-- automation node glyph -->
  <g transform="translate(70,90)" stroke="#c9b99a" stroke-width="2" fill="none" stroke-opacity="0.8">
    <circle cx="0" cy="0" r="7" fill="#c9b99a"/>
    <circle cx="70" cy="-10" r="6"/>
    <circle cx="60" cy="40" r="6"/>
    <line x1="7" y1="-2" x2="64" y2="-9"/>
    <line x1="6" y1="4" x2="55" y2="37"/>
  </g>
  <text x="70" y="545" font-family="'Inter',sans-serif" font-size="22" letter-spacing="3"
    fill="#ede9e3" fill-opacity="0.9">AUTONOMOUS · HANDS-FREE</text>
</svg>
