<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Resume generator">
  <rect width="800" height="600" fill="#0d0d0d"/>
  <!-- fanned generated documents -->
  <g transform="rotate(-9 400 300)">
    <rect x="300" y="135" width="230" height="300" rx="6" fill="#121212" stroke="#4a463d" stroke-width="2"/>
  </g>
  <g transform="rotate(-4.5 400 300)">
    <rect x="300" y="140" width="230" height="300" rx="6" fill="#161616" stroke="#6a6252" stroke-width="2"/>
  </g>
  <!-- front document -->
  <g>
    <rect x="300" y="145" width="230" height="300" rx="6" fill="#1a1a1a" stroke="#c9b99a" stroke-width="2.5"/>
    <!-- name bar -->
    <rect x="322" y="170" width="120" height="14" rx="3" fill="#c9b99a"/>
    <rect x="322" y="192" width="80" height="7" rx="3" fill="#6a6252"/>
    <!-- section rule -->
    <line x1="322" y1="214" x2="508" y2="214" stroke="#3a3a3a" stroke-width="1.5"/>
    <!-- text lines -->
    <g fill="#4a463d">
      <rect x="322" y="228" width="186" height="6" rx="3"/>
      <rect x="322" y="242" width="170" height="6" rx="3"/>
      <rect x="322" y="256" width="178" height="6" rx="3"/>
    </g>
    <line x1="322" y1="280" x2="508" y2="280" stroke="#3a3a3a" stroke-width="1.5"/>
    <g fill="#4a463d">
      <rect x="322" y="294" width="186" height="6" rx="3"/>
      <rect x="322" y="308" width="160" height="6" rx="3"/>
      <rect x="322" y="322" width="176" height="6" rx="3"/>
      <rect x="322" y="336" width="140" height="6" rx="3"/>
    </g>
    <!-- accent tag chips -->
    <rect x="322" y="360" width="46" height="16" rx="8" fill="none" stroke="#c9b99a" stroke-width="1.5"/>
    <rect x="376" y="360" width="60" height="16" rx="8" fill="none" stroke="#c9b99a" stroke-width="1.5"/>
    <rect x="444" y="360" width="40" height="16" rx="8" fill="none" stroke="#c9b99a" stroke-width="1.5"/>
  </g>
  <!-- AI spark node -->
  <g transform="translate(560,180)" stroke="#c9b99a" stroke-width="2" fill="none">
    <circle cx="0" cy="0" r="8" fill="#c9b99a"/>
    <circle cx="44" cy="-18" r="5"/>
    <circle cx="48" cy="26" r="5"/>
    <line x1="8" y1="-3" x2="39" y2="-16"/>
    <line x1="7" y1="4" x2="43" y2="23"/>
  </g>
  <text x="70" y="560" font-family="'Inter',sans-serif" font-size="22" letter-spacing="3"
    fill="#ede9e3" fill-opacity="0.9">TAILORED RESUMES · ON DEMAND</text>
</svg>
