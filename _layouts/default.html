<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>

  <nav class="nav" id="nav">
    <a href="{{ '/' | relative_url }}" class="nav-brand">FS</a>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      {% comment %} Photography & Watchmaking paused for now — remove these comment tags to restore. {% endcomment %}
      {% comment %}<a href="{{ '/photography' | relative_url }}" {% if page.url contains 'photography' %}class="active"{% endif %}>Photography</a>{% endcomment %}
      <a href="{{ '/builds' | relative_url }}" {% if page.url contains 'builds' %}class="active"{% endif %}>Builds</a>
      {% comment %}<a href="{{ '/watchmaking' | relative_url }}" {% if page.url contains 'watchmaking' %}class="active"{% endif %}>Watchmaking</a>{% endcomment %}
      <a href="{{ '/about' | relative_url }}" {% if page.url contains 'about' %}class="active"{% endif %}>About</a>
    </div>
  </nav>

  <main>{{ content }}</main>

  <footer class="footer">
    <span>© {{ 'now' | date: '%Y' }} Fares Shehadeh</span>
    <span class="footer-links">
      <a href="mailto:{{ site.email }}">Email</a>
    </span>
  </footer>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <button class="lightbox-prev" id="lightboxPrev">‹</button>
    <button class="lightbox-next" id="lightboxNext">›</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
